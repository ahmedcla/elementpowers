name: Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip and Build
        run: |
          unzip -q elementpowers.zip -d extracted_mod
          cd extracted_mod
          # إذا كان الملف المضغوط يضم مجلداً رئيسياً، سندخل داخله تلقائياً
          if [ -d "$(ls -A | head -n 1)" ] && [ "$(ls -l | grep "^d" | wc -l)" -eq 1 ]; then
            cd "$(ls -A | head -n 1)"
          fi
          chmod +x gradlew
          ./gradlew build

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: elementpowers-jar
          path: '**/build/libs/*.jar'
