name: Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip elementpowers.zip -d extracted_project
          ls -la extracted_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission and Build
        run: |
          GRADLEW_PATH=$(find extracted_project -name gradlew | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Gradlew file not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          chmod +x "$GRADLEW_PATH"
          cd "$PROJECT_DIR"
          ./gradlew build

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: elementpowers-jar
          path: '**/build/libs/*.jar'
  
