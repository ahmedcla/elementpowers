name: Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip and Build
        run: |
          mkdir -p extracted
          unzip -q elementpowers.zip -d extracted
          
          # البحث عن مكان ملف gradlew بدقة والانتقال إليه
          GRADLE_FILE=$(find extracted -name "gradlew" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: gradlew not found!"
            exit 1
          fi
          
          PROJECT_ROOT=$(dirname "$GRADLE_FILE")
          echo "Entering project directory: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: elementpowers-jar
          path: '**/build/libs/*.jar'
